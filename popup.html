<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flow Bulk Video Exporter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="eyebrow">GOOGLE FLOW</div>
      <h1>Bulk Video Exporter</h1>
      <p id="page-status" class="page-status">Checking the current tab…</p>

      <section id="job-card" class="job-card" aria-live="polite">
        <div class="job-row">
          <span id="job-message">Ready</span>
          <span id="job-mode" class="mode">Idle</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="counts">
          <span><strong id="found-count">0</strong> found</span>
          <span><strong id="success-count">0</strong> downloaded</span>
          <span><strong id="failed-count">0</strong> failed</span>
        </div>
        <p id="last-error" class="last-error" hidden></p>
        <div id="failure-report" class="failure-report" hidden>
          <div class="failure-heading">Failed videos</div>
          <div id="failure-list" class="failure-list"></div>
        </div>
      </section>

      <div class="actions">
        <button id="scan-button" class="secondary" type="button">Scan project</button>
        <button id="download-720-button" class="primary" type="button">Download all 720p</button>
        <button id="download-1080-button" class="primary upscale" type="button">Upscale + download all 1080p</button>
        <button id="retry-button" class="secondary retry" type="button" disabled>Retry failed videos</button>
        <button id="stop-button" class="danger" type="button" disabled>Stop</button>
        <button id="copy-logs-button" class="secondary copy-logs" type="button">Copy logs</button>
      </div>

      <p class="footnote">
        Keep the Flow project tab open. 1080p uses Flow’s own upscale option and requires an eligible account.
      </p>
    </main>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
